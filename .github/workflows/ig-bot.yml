name: インスタのコメント返信

on:
  schedule:
    - cron: "2-57/5 * * * *"  # 5分おき（混雑する0分を避ける）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-bot
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # 再実行でも、最新の送信記録を読む（古い記録だと二重に送ってしまう）

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: コメントに返信
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_STATE_SALT: ${{ secrets.IG_STATE_SALT }}
          IG_CLAIM_URL: ${{ secrets.IG_CLAIM_URL }}
          IG_CLAIM_SECRET: ${{ secrets.IG_CLAIM_SECRET }}
        run: python scripts/ig_bot.py

      - name: 送信済みの記録を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ig_replied.json 2>/dev/null || exit 0
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "インスタの送信記録を更新"
            git pull --rebase
            git push
          fi
