name: 週次投稿キュー生成

on:
  schedule:
    - cron: "0 22 * * 6"   # 毎週日曜 7:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ダミーデータで試す（楽天APIを使わない）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 投稿キューを生成
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ORIGIN: ${{ secrets.RAKUTEN_ORIGIN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/generate.py --dry-run
          else
            python scripts/generate.py
          fi

      - name: コミットして公開
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs history.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "投稿キュー更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
